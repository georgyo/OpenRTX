name: "Nix build"
on:
  workflow_dispatch:
  pull_request:

# Cancel superseded runs of the same PR, keep manual runs. As in main.yml,
# pushes do not start a run on their own and the event name is part of the
# group key so a manual run is never cancelled as a superseded PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # OIDC token for pushing build outputs to the niks3 binary cache
  id-token: write

env:
  NIKS3_SERVER: https://niks3.fu.io
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  # The arm-miosix-eabi toolchain is the long pole (~15 min on 16 cores). It
  # is built once and pushed to the cache so the matrix jobs substitute it.
  toolchain:
    name: Miosix toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ env.NIKS3_SERVER }}
      - name: Build
        run: nix build -L .#miosix-toolchain

  # The job matrix comes from the flake itself: `githubActions.matrix` in
  # flake.nix, generated by nix-community/nix-github-actions, lists one job
  # per package, check and dev shell. A target added to nix/targets.nix or a
  # new check gets a job here without touching this file.
  matrix:
    name: Job matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@main
      # Evaluates every output for every supported system, not only the
      # x86_64-linux attributes the matrix then builds.
      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build
      - id: set-matrix
        name: Generate the matrix
        run: |
          set -Eeuo pipefail
          matrix="$(nix eval --json '.#githubActions.matrix')"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: [matrix, toolchain]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ env.NIKS3_SERVER }}
      - name: Build
        run: nix build -L '.#${{ matrix.attr }}'
      - name: List outputs
        run: ls -laL result
      # One artifact per radio, named and laid out like the ones main.yml
      # publishes (openrtx-<radio> holding openrtx_<radio>_<branch>.<ext>), so
      # a tester gets the same download from either workflow. The firmware
      # packages are the openrtx-* attributes; the ELF with debug info is
      # left out, as in main.yml.
      - name: Collect firmware
        if: startsWith(matrix.name, 'openrtx-')
        run: |
          set -Eeuo pipefail
          branch="$(echo "$BRANCH_NAME" | tr '/' '-')"
          mkdir -p firmware
          for f in result/*; do
            name="$(basename "$f")"
            case "$name" in
              *.elf) continue ;;
              openrtx_*.*) name="${name%.*}_${branch}.${name##*.}" ;;
            esac
            cp -L "$f" "firmware/$name"
          done
          ls -la firmware
      - name: Upload the firmware for this radio
        if: startsWith(matrix.name, 'openrtx-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: firmware/
          if-no-files-found: error

  # Everything at once, substituted from the cache, and the per-radio
  # artifacts merged into one, like main.yml's release-bins.
  all:
    name: All firmware images
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ env.NIKS3_SERVER }}
      - name: Build
        run: nix build -L .#all
      - name: Download the per-radio artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openrtx-*
          merge-multiple: true
          path: images
      - name: List images
        run: ls -la images
      - uses: actions/upload-artifact@v4
        with:
          name: nix-release-bins
          path: images/
          if-no-files-found: error
